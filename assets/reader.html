<script>
(()=>{'use strict';const $=id=>document.getElementById(id),root=document.documentElement;let font=18,theme='light',zoom=1,lastTrigger=null;const prefs={get(k){try{return localStorage.getItem('paper-reader-'+root.dataset.documentId+'-'+k)}catch{return null}},set(k,v){try{localStorage.setItem('paper-reader-'+root.dataset.documentId+'-'+k,v)}catch{}}};
